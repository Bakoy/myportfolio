# Development: runs the Vite dev server with hot reload.
#
#   docker compose -f docker-compose.dev.yml up
#   -> http://localhost:5173
#
# Source is bind-mounted, dependencies live in a named volume so the host's
# node_modules (possibly built for another OS/arch) is never used.

services:
  app-dev:
    image: node:24-alpine
    container_name: myportfolio-dev
    working_dir: /app
    command: sh -c 'npm ci && npm run dev -- --host 0.0.0.0'
    restart: unless-stopped
    ports:
      - '${DEV_PORT:-5173}:5173'
    environment:
      # Helps file watching on Docker Desktop / network filesystems
      CHOKIDAR_USEPOLLING: 'true'
      # Google Analytics measurement ID, read from the local .env file.
      VITE_GTAG_ID: ${VITE_GTAG_ID:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    tty: true

volumes:
  node_modules:
