server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff2;

    # Security headers (declared once here so they are inherited by every
    # location below; adding `add_header` inside a location would reset them)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-lived cache for fingerprinted build assets
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the HTML entry point
    location = /index.html {
        expires -1;
    }

    # SPA fallback (works fine even though the app currently has no router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
